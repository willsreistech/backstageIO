services:
  backstage:
    image: ${BACKSTAGE_IMAGE:?BACKSTAGE_IMAGE is required}
    container_name: ${BACKSTAGE_CONTAINER_NAME:?BACKSTAGE_CONTAINER_NAME is required}
    restart: unless-stopped
    ports:
      - "${BACKSTAGE_PORT:?BACKSTAGE_PORT is required}:7007"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
      NODE_OPTIONS: "--no-node-snapshot --tls-max-v1.2"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      BACKSTAGE_GH_APP_ID: ${BACKSTAGE_GH_APP_ID:?BACKSTAGE_GH_APP_ID is required}
      BACKSTAGE_GH_APP_CLIENT_ID: ${BACKSTAGE_GH_APP_CLIENT_ID:?BACKSTAGE_GH_APP_CLIENT_ID is required}
      BACKSTAGE_GH_APP_CLIENT_SECRET: ${BACKSTAGE_GH_APP_CLIENT_SECRET:?BACKSTAGE_GH_APP_CLIENT_SECRET is required}
      BACKSTAGE_GH_APP_PRIVATE_KEY_B64: ${BACKSTAGE_GH_APP_PRIVATE_KEY_B64:?BACKSTAGE_GH_APP_PRIVATE_KEY_B64 is required}
      GITHUB_OWNER: ${GHUB_OWNER:?GHUB_OWNER is required}
      GITHUB_REPO: ${GHUB_REPO:?GHUB_REPO is required}
      GITHUB_ALLOWED_REPOS: ${GHUB_ALLOWED_REPOS:?GHUB_ALLOWED_REPOS is required}
      GITHUB_BRANCH: ${GHUB_BRANCH:?GHUB_BRANCH is required}
      TECHDOCS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      TECHDOCS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      KEYCLOAK_METADATA_URL: ${KEYCLOAK_METADATA_URL:?KEYCLOAK_METADATA_URL is required}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-backstage}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_INTERNAL_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_CATALOG_CLIENT_ID: ${KEYCLOAK_CATALOG_CLIENT_ID:-backstage-catalog}
      KEYCLOAK_CATALOG_CLIENT_SECRET: ${KEYCLOAK_CATALOG_CLIENT_SECRET:?KEYCLOAK_CATALOG_CLIENT_SECRET is required}
    networks:
      - default
      - backstage-auth
    volumes:
      - ./app-config.deploy.yaml:/app/app-config.deploy.yaml:ro
    command:
      - sh
      - -c
      - |
          set -eu
          encoded_key="$$(printf '%s' "$${BACKSTAGE_GH_APP_PRIVATE_KEY_B64}" | tr -d '[:space:]')"
          if ! decoded_key="$$(printf '%s' "$$encoded_key" | base64 -d)"; then
            echo "Invalid GitHub App private key encoding" >&2
            exit 1
          fi
          export BACKSTAGE_GH_APP_PRIVATE_KEY="$$decoded_key"
          exec node packages/backend \
            --config app-config.yaml \
            --config app-config.production.yaml \
            --config app-config.deploy.yaml
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    container_name: ${MINIO_CONTAINER_NAME:?MINIO_CONTAINER_NAME is required}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_PORT:?MINIO_PORT is required}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE is required}
    container_name: ${MINIO_INIT_CONTAINER_NAME:?MINIO_INIT_CONTAINER_NAME is required}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required} &&
      mc mb --ignore-existing local/techdocs
      "
    restart: "no"

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: ${POSTGRES_CONTAINER_NAME:?POSTGRES_CONTAINER_NAME is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  miniodata:

networks:
  backstage-auth:
    name: backstage-auth
    external: true

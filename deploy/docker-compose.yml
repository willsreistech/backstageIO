# Stack de deploy (backend Backstage + Postgres).
# A pipeline (deploy-reusable.yml) copia este arquivo + app-config.deploy.yaml
# + um .env (gerado a partir dos secrets do Environment) para o deploy-dir do
# host e roda `docker compose up -d`. Todos os ${...} vêm desse .env.
services:
  backstage:
    image: ${IMAGE_TAG:-backstage:latest}
    container_name: backstage
    restart: unless-stopped
    ports:
      - "${BACKSTAGE_PORT:-7007}:7007"
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      # FortiGate (SSL-inspection) só intercepta TLS 1.3 e devolve cadeia
      # incompleta; forçar TLS 1.2 passa direto (cert real do GitHub verificável),
      # necessário p/ o catálogo/TechDocs do k9 lerem api.github.com de dentro do container.
      # Preserve o snapshot desativado exigido pelo Scaffolder e também
      # limite o TLS por causa do FortiGate.
      NODE_OPTIONS: "--no-node-snapshot --tls-max-v1.2"
      # Postgres (serviço abaixo, mesma rede do compose)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # GitHub App (catalog, Scaffolder Actions dispatch, and file uploads).
      BACKSTAGE_GH_APP_ID: ${BACKSTAGE_GH_APP_ID}
      BACKSTAGE_GH_APP_CLIENT_ID: ${BACKSTAGE_GH_APP_CLIENT_ID}
      BACKSTAGE_GH_APP_CLIENT_SECRET: ${BACKSTAGE_GH_APP_CLIENT_SECRET}
      BACKSTAGE_GH_APP_PRIVATE_KEY: ${BACKSTAGE_GH_APP_PRIVATE_KEY:-}
      BACKSTAGE_GH_APP_PRIVATE_KEY_B64: ${BACKSTAGE_GH_APP_PRIVATE_KEY_B64}
      GITHUB_OWNER: ${GITHUB_OWNER:-willsreistech}
      GITHUB_REPO: ${GITHUB_REPO:-k9}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      # TechDocs (builder externo): o backend só LÊ o HTML pronto do MinIO
      # (S3-compatible). Quem GERA/publica é o CI de cada repositório
      # (workflow techdocs-publish-reusable.yml).
      TECHDOCS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      TECHDOCS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Auth OIDC: o backend usa a rede compartilhada; Keycloak mantém a URL
      # pública para o navegador e anuncia endpoints de backchannel internos.
      KEYCLOAK_METADATA_URL: "${KEYCLOAK_INTERNAL_METADATA_URL:-http://keycloak:8080/realms/backstage/.well-known/openid-configuration}"
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-backstage}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Sessão do backend (exigida pelo fluxo OIDC)
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      # Ingestão de Users/Groups do Keycloak no catálogo
      KEYCLOAK_BASE_URL: "${KEYCLOAK_INTERNAL_BASE_URL:-http://keycloak:8080}"
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    networks:
      - default
      - backstage-auth
    volumes:
      # Config extra (readiciona o catálogo do k9, que a app-config.production
      # sobrescreveria). Montada read-only.
      - ./app-config.deploy.yaml:/app/app-config.deploy.yaml:ro
    command:
      - sh
      - -c
      - |
          set -eu
          if [ -n "$${BACKSTAGE_GH_APP_PRIVATE_KEY_B64:-}" ]; then
            if ! decoded_key="$$(printf '%s' "$${BACKSTAGE_GH_APP_PRIVATE_KEY_B64}" | base64 -d)"; then
              echo "Invalid GitHub App private key encoding" >&2
              exit 1
            fi
            export BACKSTAGE_GH_APP_PRIVATE_KEY="$$decoded_key"
          fi
          for attempt in $$(seq 1 60); do
            if node -e "fetch(process.env.KEYCLOAK_METADATA_URL).then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$$attempt" -eq 60 ]; then
              echo "Keycloak OIDC metadata did not become available" >&2
              exit 1
            fi
            echo "Waiting for Keycloak OIDC metadata ($$attempt/60)" >&2
            sleep 5
          done
          exec node packages/backend \
            --config app-config.yaml \
            --config app-config.production.yaml \
            --config app-config.deploy.yaml
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── MinIO: storage S3-compatible para o TechDocs (builder externo) ─────────
  # Lab: substitui S3/GCS. Em prod basta trocar o publisher p/ um bucket real.
  # Imagem side-loaded pela pipeline (FortiGate bloqueia pull no servidor).
  minio:
    image: minio/minio:latest
    container_name: backstage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # 9000 exposto no host: o CI dos repositórios publica os docs aqui.
      - "${MINIO_PORT:-9000}:9000"
      # Console web (admin) — opcional.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: cria o bucket `techdocs` se não existir e sai.
  minio-init:
    image: minio/mc:latest
    container_name: backstage-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/techdocs
      "
    restart: "no"

  postgres:
    image: postgres:15
    container_name: backstage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Banco default = mesmo nome do usuário (o pg-client conecta nele antes de
      # o Backstage criar os bancos backstage_plugin_*).
      POSTGRES_DB: ${POSTGRES_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  miniodata:

networks:
  backstage-auth:
    name: backstage-auth
    external: true

# Config extra carregada POR ÚLTIMO no deploy (via docker-compose `command`).
#
# Por que existe: no Backstage, quando várias configs são carregadas, as LISTAS
# são SUBSTITUÍDAS (não concatenadas). A app-config.production.yaml define
# `catalog.locations` só com os exemplos, o que APAGARIA o k9. Aqui redefinimos
# a lista COMPLETA (exemplos + k9), e como esta é a última config carregada, ela
# vence.
#
# Este arquivo é montado read-only em /app/app-config.deploy.yaml pelo compose,
# então não precisa entrar na imagem.

# Deploy é HTTP puro (sem TLS na frente). Por padrão o Backstage/Helmet envia a
# diretiva CSP `upgrade-insecure-requests`, que faz o navegador buscar TODOS os
# assets em https:// — como não há HTTPS, o JS falha (ERR_SSL_PROTOCOL_ERROR) e
# a página fica em branco. Desligar a diretiva resolve.
backend:
  csp:
    upgrade-insecure-requests: false

# ── Auth: Keycloak (OIDC) ────────────────────────────────────────────────────
# Keycloak do lab roda no mesmo servidor (repo keycloakwsr, porta 8081).
# Em prod real só muda KEYCLOAK_METADATA_URL (servidor dedicado).
# Guest continua habilitado (herdado da app-config.production.yaml) para
# fallback durante a transição.
auth:
  environment: production
  # OBRIGATÓRIO p/ OIDC: o fluxo (openid-client/passport) usa sessão no
  # backend — sem isso o /oidc/start falha com
  # "authentication requires session support".
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: ${KEYCLOAK_METADATA_URL}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            # Lab: aceita qualquer usuário do realm mesmo sem User entity no
            # catálogo. Em prod: ingerir users/groups do Keycloak no catálogo
            # (plugin catalog-backend-module-keycloak) e remover a flag.
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

# ── Catálogo: ingestão de Users/Groups do Keycloak ───────────────────────────
# Sincroniza os usuários/grupos do realm `backstage` como entidades User/Group.
# Lab: autentica com o admin (username/password). Em prod: usar um client com
# service account + roles view-users/query-users e trocar por clientId/secret;
# aí dá pra remover o dangerouslyAllowSignInWithoutUserInCatalog acima.
# (config de catalog continua no bloco `catalog:` único, abaixo)

# ── TechDocs: builder EXTERNO (arquitetura recomendada p/ muitos repos) ──────
# O backend NÃO gera mais docs on-the-fly (nada de mkdocs/pip aqui): ele só
# SERVE o HTML pronto que o CI de cada repositório publica no MinIO
# (S3-compatible) via workflow techdocs-publish-reusable.yml.
# Em produção real: trocar endpoint/creds por um bucket S3/GCS gerenciado —
# a arquitetura permanece idêntica.
techdocs:
  builder: 'external'
  publisher:
    type: 'awsS3'
    awsS3:
      bucketName: techdocs
      region: us-east-1
      # MinIO na mesma rede do compose.
      endpoint: http://minio:9000
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${TECHDOCS_S3_ACCESS_KEY}
        secretAccessKey: ${TECHDOCS_S3_SECRET_KEY}

catalog:
  # Permite também User/Group (ingeridos do Keycloak). Listas são
  # SUBSTITUÍDAS entre configs e esta é a última carregada — vence.
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: master
        realm: backstage
        username: ${KEYCLOAK_ADMIN_USER}
        password: ${KEYCLOAK_ADMIN_PASSWORD}
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 3 }
  locations:
    # Dados de exemplo (paths relativos ao cwd do backend = /app)
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

    # ── k9 — Kind Kubernetes Lab ─────────────────────────────────────────────
    # catalog-info do k9 entra via discovery (catalog.providers.github na
    # app-config.yaml base) — não listar aqui para não duplicar a entidade.
    # Template Scaffolder (fora da raiz do repo → discovery não encontra):
    - type: url
      target: https://github.com/willsreistech/k9/blob/main/backstage/create-cluster-template.yaml
      rules:
        - allow: [Template]

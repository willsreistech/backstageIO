version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       backstage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backstage:
    image: backstage:latest          # imagem buildada pelo Actions
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # só sobe após o Postgres estar pronto
    ports:
      - "7007:7007"
    environment:
      APP_BASE_URL:      ${APP_BASE_URL}
      GITHUB_TOKEN:      ${GITHUB_TOKEN}
      GITHUB_OWNER:      ${GITHUB_OWNER}
      GITHUB_REPO:       ${GITHUB_REPO}
      GITHUB_BRANCH:     ${GITHUB_BRANCH}
      POSTGRES_HOST:     postgres    # nome do serviço acima — Docker resolve internamente
      POSTGRES_PORT:     5432
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backstage-uploads:/home/node/data/uploads

volumes:
  postgres-data:
  backstage-uploads:

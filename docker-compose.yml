services:
  backstage:
    image: backstage:latest       # gerada por `yarn build-image` (tag: backstage)
    container_name: backstage
    restart: unless-stopped
    ports:
      - "7007:7007"
    environment:
      # >>> TROQUE pelo IP/host que o navegador vai acessar (NAO use localhost se
      #     for acessar de outra máquina). Ex.: http://192.168.1.10:7007
      APP_BASE_URL: http://192.168.56.10:7007

      # Postgres (serviço abaixo)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage

      # GitHub App (catalog, Scaffolder Actions dispatch, and file uploads).
      BACKSTAGE_GH_APP_ID: ${BACKSTAGE_GH_APP_ID}
      BACKSTAGE_GH_APP_CLIENT_ID: ${BACKSTAGE_GH_APP_CLIENT_ID}
      BACKSTAGE_GH_APP_CLIENT_SECRET: ${BACKSTAGE_GH_APP_CLIENT_SECRET}
      BACKSTAGE_GH_APP_PRIVATE_KEY: ${BACKSTAGE_GH_APP_PRIVATE_KEY:-}
      BACKSTAGE_GH_APP_PRIVATE_KEY_B64: ${BACKSTAGE_GH_APP_PRIVATE_KEY_B64:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-willsreistech}
      GITHUB_REPO: ${GITHUB_REPO:-k9}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
    command:
      - sh
      - -c
      - |
          set -eu
          if [ -n "$${BACKSTAGE_GH_APP_PRIVATE_KEY_B64:-}" ]; then
            encoded_key="$$(printf '%s' "$${BACKSTAGE_GH_APP_PRIVATE_KEY_B64}" | tr -d '[:space:]')"
            if ! decoded_key="$$(printf '%s' "$$encoded_key" | base64 -d)"; then
              echo "Invalid GitHub App private key encoding" >&2
              exit 1
            fi
            export BACKSTAGE_GH_APP_PRIVATE_KEY="$$decoded_key"
          fi
          exec node packages/backend \
            --config app-config.yaml \
            --config app-config.production.yaml
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: backstage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      POSTGRES_DB: backstage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

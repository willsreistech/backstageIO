name: Build & Deploy

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'

# ── Roteamento por branch ─────────────────────────────────────────────────────
# Cada job apenas decide (via `if`) se aquele ambiente deve rodar e delega TODO
# o trabalho para o reusable workflow `deploy-reusable.yml`, variando só os
# `inputs`. `secrets: inherit` repassa os secrets do repo/environment.
#
#   • environment / runner  → apontam pro environment e runner self-hosted certos
#   • deploy-dir            → diretório no host onde o stack sobe
#   • image-tag             → tag da imagem construída

jobs:

  # ── development: develop e feature/* ──────────────────────────────────────
  development:
    name: development
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: development
      runner: development
      ssh-host: 192.168.56.10
      ssh-user: wsr
      deploy-dir: ~/backstage-dev
      image-tag: backstage:development

  # ── quality: release/* ────────────────────────────────────────────────────
  quality:
    name: quality
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: quality
      runner: quality
      ssh-host: 192.168.56.10
      ssh-user: wsr
      deploy-dir: ~/backstage-qa
      image-tag: backstage:quality

  # ── production: main ──────────────────────────────────────────────────────
  production:
    name: production
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: production
      runner: production
      ssh-host: 192.168.56.10
      ssh-user: wsr
      deploy-dir: ~/backstage
      image-tag: backstage:latest

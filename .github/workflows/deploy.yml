name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente que receberá o deploy
        required: true
        type: choice
        default: development
        options:
          - development
          - quality
          - production
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'

# ── Roteamento por branch ─────────────────────────────────────────────────────
# Cada job apenas decide (via `if`) se aquele ambiente deve rodar e delega TODO
# o trabalho para o reusable workflow `deploy-reusable.yml`, variando só os
# `inputs`. `secrets: inherit` repassa os secrets do repo/environment.
#
#   • environment / runner  → apontam pro environment e runner self-hosted certos
#   • deploy-dir            → diretório no host onde o stack sobe
#   • image-tag             → tag da imagem construída

jobs:

  # ── development: develop e feature/* ──────────────────────────────────────
  development:
    name: development
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: development
      runner: development
      deploy-dir: /home/wsr/backstage-dev
      image-tag: backstage:development

  # ── quality: release/* ────────────────────────────────────────────────────
  quality:
    name: quality
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'quality')
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: quality
      runner: quality
      deploy-dir: /home/wsr/backstage-qa
      image-tag: backstage:quality

  # ── production: main ──────────────────────────────────────────────────────
  production:
    name: production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: ./.github/workflows/deploy-reusable.yml
    secrets: inherit
    with:
      environment: production
      runner: production
      deploy-dir: /home/wsr/backstage
      image-tag: backstage:latest

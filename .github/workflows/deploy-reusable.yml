name: Deploy (reusable)

# ── Reusable workflow ─────────────────────────────────────────────────────────
# Contém TODA a lógica de deploy: build do app no runner, build da imagem Docker
# (com o gerador MkDocs/TechDocs embutido), geração do .env a partir dos secrets,
# subida do stack (backend + Postgres) e health check. É chamado por deploy.yml,
# uma vez por ambiente, variando só os `inputs`.
#
# Os secrets são herdados do caller via `secrets: inherit`. Como o job declara
# `environment: ${{ inputs.environment }}`, os secrets do environment correto
# ficam disponíveis automaticamente.

on:
  workflow_call:
    inputs:
      environment:
        description: Nome do environment do GitHub (development/quality/production)
        required: true
        type: string
      runner:
        description: Label do runner self-hosted (development/quality/production)
        required: true
        type: string
      deploy-dir:
        description: Diretório de deploy no host (ex. ~/backstage)
        required: true
        type: string
      image-tag:
        description: Tag da imagem Docker a construir (ex. backstage:latest)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn)
        run: corepack enable || echo "corepack já habilitado no runner"

      # Build do app no runner (gera packages/backend/dist/{skeleton,bundle}.tar.gz).
      - name: Build backend bundle
        working-directory: backstage-app
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          # Remove yarnPath (release não versionado); corepack usa packageManager.
          sed -i '/yarnPath/d' .yarnrc.yml
          yarn install --immutable
          yarn tsc
          yarn build:backend

      # Imagem usa o deploy/Dockerfile (host-build) com contexto = backstage-app.
      - name: Build image
        run: docker build backstage-app -f deploy/Dockerfile -t "${{ inputs.image-tag }}"

      - name: Write .env
        # Secrets do environment expostos como env (sem o prefixo reservado GITHUB_)
        # e gravados no .env com os nomes que a aplicação/compose esperam.
        env:
          APP_BASE_URL:      ${{ secrets.APP_BASE_URL }}
          GHUB_TOKEN:        ${{ secrets.GHUB_TOKEN }}
          GHUB_OWNER:        ${{ secrets.GHUB_OWNER }}
          GHUB_REPO:         ${{ secrets.GHUB_REPO }}
          GHUB_BRANCH:       ${{ secrets.GHUB_BRANCH }}
          POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          mkdir -p "${{ inputs.deploy-dir }}"
          cat > "${{ inputs.deploy-dir }}/.env" << ENVEOF
          IMAGE_TAG=${{ inputs.image-tag }}
          APP_BASE_URL=${APP_BASE_URL}
          GITHUB_TOKEN=${GHUB_TOKEN}
          GITHUB_OWNER=${GHUB_OWNER}
          GITHUB_REPO=${GHUB_REPO}
          GITHUB_BRANCH=${GHUB_BRANCH}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          ENVEOF
          chmod 600 "${{ inputs.deploy-dir }}/.env"

      - name: Deploy stack
        run: |
          cp deploy/docker-compose.yml     "${{ inputs.deploy-dir }}/docker-compose.yml"
          cp deploy/app-config.deploy.yaml "${{ inputs.deploy-dir }}/app-config.deploy.yaml"
          cd "${{ inputs.deploy-dir }}"
          docker compose up -d --remove-orphans

      - name: Health check
        run: |
          cd "${{ inputs.deploy-dir }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7007/healthcheck >/dev/null 2>&1 \
               || curl -fsS http://localhost:7007 >/dev/null 2>&1; then
              echo "✅ Backstage UP"
              docker compose ps
              exit 0
            fi
            echo "aguardando backstage subir... ($i/30)"
            sleep 5
          done
          echo "❌ Health check falhou — últimos logs:"
          docker compose logs --tail=120 backstage
          exit 1

name: Deploy (reusable)

# ── Reusable workflow ─────────────────────────────────────────────────────────
# Contém toda a lógica de build e deploy na VM que executa o runner:
#   1. Builda a imagem Docker no runner.
#   2. Gera o .env a partir dos secrets do environment.
#   3. Executa o Docker Compose localmente na VM.
#   4. Faz o health check local.
#
# Pré-requisitos no runner: Docker, Docker Compose e permissão do usuário para
# executar Docker. A rede externa `backstage-auth` deve ser criada pelo job.

on:
  workflow_call:
    inputs:
      environment:
        description: Nome do environment do GitHub (development/quality/production)
        required: true
        type: string
      runner:
        description: Label do runner self-hosted (development/quality/production)
        required: true
        type: string
      deploy-dir:
        description: Diretório de deploy na VM (ex. /home/wsr/backstage)
        required: true
        type: string
      image-tag:
        description: Tag da imagem Docker a construir (ex. backstage:latest)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          APP_BASE_URL:      ${{ secrets.APP_BASE_URL }}
          GHUB_OWNER:        ${{ secrets.GHUB_OWNER }}
          GHUB_REPO:         ${{ secrets.GHUB_REPO }}
          GHUB_ALLOWED_REPOS: ${{ secrets.GHUB_ALLOWED_REPOS || secrets.GHUB_REPO }}
          GHUB_BRANCH:       ${{ secrets.GHUB_BRANCH }}
          BACKSTAGE_GH_APP_ID:     ${{ secrets.BACKSTAGE_GH_APP_ID }}
          BACKSTAGE_GH_APP_CLIENT_ID:     ${{ secrets.BACKSTAGE_GH_APP_CLIENT_ID }}
          BACKSTAGE_GH_APP_CLIENT_SECRET: ${{ secrets.BACKSTAGE_GH_APP_CLIENT_SECRET }}
          BACKSTAGE_GH_APP_PRIVATE_KEY_B64: ${{ secrets.BACKSTAGE_GH_APP_PRIVATE_KEY_B64 }}
          POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ secrets.POSTGRES_DB || secrets.POSTGRES_USER }}
          POSTGRES_HOST:     ${{ secrets.POSTGRES_HOST }}
          KC_CLIENT_SECRET:  ${{ secrets.KEYCLOAK_CLIENT_SECRET || secrets.KC_CLIENT_SECRET }}
          KC_CATALOG_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CATALOG_CLIENT_SECRET }}
          SESSION_SECRET:    ${{ secrets.AUTH_SESSION_SECRET }}
          KC_INTERNAL_METADATA_URL: ${{ secrets.KEYCLOAK_INTERNAL_METADATA_URL }}
          KC_INTERNAL_BASE_URL:     ${{ secrets.KEYCLOAK_INTERNAL_BASE_URL }}
        run: |
          missing=0
          for name in APP_BASE_URL GHUB_OWNER GHUB_REPO GHUB_BRANCH BACKSTAGE_GH_APP_ID BACKSTAGE_GH_APP_CLIENT_ID BACKSTAGE_GH_APP_CLIENT_SECRET BACKSTAGE_GH_APP_PRIVATE_KEY_B64 POSTGRES_USER POSTGRES_PASSWORD KC_CLIENT_SECRET KC_CATALOG_CLIENT_SECRET SESSION_SECRET; do
            case "$name" in
              APP_BASE_URL) value="$APP_BASE_URL" ;;
              GHUB_OWNER) value="$GHUB_OWNER" ;;
              GHUB_REPO) value="$GHUB_REPO" ;;
              GHUB_BRANCH) value="$GHUB_BRANCH" ;;
              BACKSTAGE_GH_APP_ID) value="$BACKSTAGE_GH_APP_ID" ;;
              BACKSTAGE_GH_APP_CLIENT_ID) value="$BACKSTAGE_GH_APP_CLIENT_ID" ;;
              BACKSTAGE_GH_APP_CLIENT_SECRET) value="$BACKSTAGE_GH_APP_CLIENT_SECRET" ;;
              BACKSTAGE_GH_APP_PRIVATE_KEY_B64) value="$BACKSTAGE_GH_APP_PRIVATE_KEY_B64" ;;
              POSTGRES_USER) value="$POSTGRES_USER" ;;
              POSTGRES_PASSWORD) value="$POSTGRES_PASSWORD" ;;
              KC_CLIENT_SECRET) value="$KC_CLIENT_SECRET" ;;
              KC_CATALOG_CLIENT_SECRET) value="$KC_CATALOG_CLIENT_SECRET" ;;
              SESSION_SECRET) value="$SESSION_SECRET" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Secret obrigatório ausente: $name"
              missing=1
            fi
          done
          if [ -n "$KC_INTERNAL_METADATA_URL" ] && [ -z "$KC_INTERNAL_BASE_URL" ]; then
            echo "::error::KEYCLOAK_INTERNAL_METADATA_URL e KEYCLOAK_INTERNAL_BASE_URL devem ser definidos juntos"
            missing=1
          fi
          if [ -n "$KC_INTERNAL_BASE_URL" ] && [ -z "$KC_INTERNAL_METADATA_URL" ]; then
            echo "::error::KEYCLOAK_INTERNAL_METADATA_URL e KEYCLOAK_INTERNAL_BASE_URL devem ser definidos juntos"
            missing=1
          fi
          case "$APP_BASE_URL" in
            http://*:*|https://*:*) ;;
            *)
              echo "::error::APP_BASE_URL deve ser uma URL absoluta com protocolo e porta (ex.: http://192.168.1.250:7007)"
              missing=1
              ;;
          esac
          case "$BACKSTAGE_GH_APP_ID" in
            ''|*[!0-9]*)
              echo "::error::BACKSTAGE_GH_APP_ID deve conter apenas o App ID numérico do GitHub App (não use Client ID, Client Secret ou nome do App)"
              missing=1
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Build da imagem AQUI (multi-stage self-contained: não precisa Node no host).
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build backstage-app -f deploy/Dockerfile -t "${{ inputs.image-tag }}"

      - name: Write .env
        # Secrets do environment expostos como env (sem o prefixo reservado GITHUB_)
        # e gravados no .env com os nomes que a aplicação/compose esperam.
        env:
          APP_BASE_URL:      ${{ secrets.APP_BASE_URL }}
          GHUB_OWNER:        ${{ secrets.GHUB_OWNER }}
          GHUB_REPO:         ${{ secrets.GHUB_REPO }}
          GHUB_ALLOWED_REPOS: ${{ secrets.GHUB_ALLOWED_REPOS || secrets.GHUB_REPO }}
          GHUB_BRANCH:       ${{ secrets.GHUB_BRANCH }}
          BACKSTAGE_GH_APP_ID:     ${{ secrets.BACKSTAGE_GH_APP_ID }}
          BACKSTAGE_GH_APP_CLIENT_ID:     ${{ secrets.BACKSTAGE_GH_APP_CLIENT_ID }}
          BACKSTAGE_GH_APP_CLIENT_SECRET: ${{ secrets.BACKSTAGE_GH_APP_CLIENT_SECRET }}
          BACKSTAGE_GH_APP_PRIVATE_KEY_B64: ${{ secrets.BACKSTAGE_GH_APP_PRIVATE_KEY_B64 }}
          POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ secrets.POSTGRES_DB || secrets.POSTGRES_USER }}
          POSTGRES_HOST:     ${{ secrets.POSTGRES_HOST }}
          MINIO_USER:        ${{ secrets.MINIO_ROOT_USER }}
          MINIO_PASSWORD:    ${{ secrets.MINIO_ROOT_PASSWORD }}
          KC_CLIENT_SECRET:  ${{ secrets.KEYCLOAK_CLIENT_SECRET || secrets.KC_CLIENT_SECRET }}
          # Optional in the lab: the compose default uses keycloak:8080 on
          # the shared Docker network. Set these for a dedicated production
          # Keycloak endpoint.
          KC_INTERNAL_METADATA_URL: ${{ secrets.KEYCLOAK_INTERNAL_METADATA_URL }}
          KC_INTERNAL_BASE_URL:     ${{ secrets.KEYCLOAK_INTERNAL_BASE_URL }}
          KC_CATALOG_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CATALOG_CLIENT_SECRET }}
          SESSION_SECRET:    ${{ secrets.AUTH_SESSION_SECRET }}
        run: |
          umask 077
          private_key_input="$BACKSTAGE_GH_APP_PRIVATE_KEY_B64"
          if printf '%s' "$private_key_input" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            private_key_pem="$(printf '%s' "$private_key_input" | sed 's/\\n/\n/g')"
            private_key_b64="$(printf '%s' "$private_key_pem" | base64 | tr -d '\r\n')"
          else
            private_key_b64="$(printf '%s' "$private_key_input" | tr -d '[:space:]')"
          fi
          if ! decoded_private_key="$(printf '%s' "$private_key_b64" | base64 -d 2>/dev/null)"; then
            echo "::error::BACKSTAGE_GH_APP_PRIVATE_KEY_B64 não contém Base64 válido ou uma chave PEM"
            exit 1
          fi
          if ! printf '%s' "$decoded_private_key" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::BACKSTAGE_GH_APP_PRIVATE_KEY_B64 não decodifica uma chave privada PEM"
            exit 1
          fi
          cat > .env << ENVEOF
          BACKSTAGE_IMAGE=${{ inputs.image-tag }}
          BACKSTAGE_CONTAINER_NAME=backstage
          BACKSTAGE_PORT=7007
          MINIO_IMAGE=minio/minio:latest
          MINIO_MC_IMAGE=minio/mc:latest
          MINIO_CONTAINER_NAME=backstage-minio
          MINIO_INIT_CONTAINER_NAME=backstage-minio-init
          MINIO_PORT=9000
          MINIO_CONSOLE_PORT=9001
          APP_BASE_URL=${APP_BASE_URL}
          GHUB_OWNER=${GHUB_OWNER}
          GHUB_REPO=${GHUB_REPO}
          GHUB_ALLOWED_REPOS=${GHUB_ALLOWED_REPOS}
          GHUB_BRANCH=${GHUB_BRANCH}
          BACKSTAGE_GH_APP_ID=${BACKSTAGE_GH_APP_ID}
          BACKSTAGE_GH_APP_CLIENT_ID=${BACKSTAGE_GH_APP_CLIENT_ID}
          BACKSTAGE_GH_APP_CLIENT_SECRET=${BACKSTAGE_GH_APP_CLIENT_SECRET}
          BACKSTAGE_GH_APP_PRIVATE_KEY_B64=${private_key_b64}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB:-$POSTGRES_USER}
          POSTGRES_HOST=${POSTGRES_HOST:-platform-postgres}
          POSTGRES_PORT=5432
          MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
          MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
          KEYCLOAK_CLIENT_ID=backstage
          KEYCLOAK_CLIENT_SECRET=${KC_CLIENT_SECRET}
          KEYCLOAK_METADATA_URL=${KC_INTERNAL_METADATA_URL:-http://keycloak:8080/realms/backstage/.well-known/openid-configuration}
          KEYCLOAK_INTERNAL_METADATA_URL=${KC_INTERNAL_METADATA_URL}
          KEYCLOAK_INTERNAL_BASE_URL=${KC_INTERNAL_BASE_URL}
          KEYCLOAK_CATALOG_CLIENT_ID=backstage-catalog
          KEYCLOAK_CATALOG_CLIENT_SECRET=${KC_CATALOG_CLIENT_SECRET}
          AUTH_SESSION_SECRET=${SESSION_SECRET}
          ENVEOF
          chmod 600 .env

      - name: Deploy locally
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${{ inputs.deploy-dir }}"
          cp deploy/docker-compose.yml deploy/app-config.deploy.yaml .env "${{ inputs.deploy-dir }}/"
          docker network inspect backstage-auth >/dev/null 2>&1 || docker network create backstage-auth
          docker network inspect platform-data >/dev/null 2>&1 || { echo "platform-database deve ser implantado primeiro" >&2; exit 1; }
          cd "${{ inputs.deploy-dir }}"
          docker compose config --quiet
          docker compose up -d --remove-orphans

      - name: Health check
        run: |
          for attempt in $(seq 1 80); do
            if curl -fsS http://localhost:7007 >/dev/null 2>&1; then
              docker compose --env-file "${{ inputs.deploy-dir }}/.env" -f "${{ inputs.deploy-dir }}/docker-compose.yml" ps
              exit 0
            fi
            echo "aguardando backstage subir... ($attempt/80)"
            sleep 5
          done
          docker compose --env-file "${{ inputs.deploy-dir }}/.env" -f "${{ inputs.deploy-dir }}/docker-compose.yml" ps
          docker compose --env-file "${{ inputs.deploy-dir }}/.env" -f "${{ inputs.deploy-dir }}/docker-compose.yml" logs --no-color --since=20m backstage
          exit 1

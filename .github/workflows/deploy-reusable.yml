name: Deploy (reusable)

# ── Reusable workflow ─────────────────────────────────────────────────────────
# Contém TODA a lógica de deploy no modelo HÍBRIDO:
#   1. Builda a imagem Docker AQUI no runner (que tem rede/registry liberados e
#      embute o gerador MkDocs/TechDocs).
#   2. Envia a imagem pronta para o servidor de deploy via SSH
#      (`docker save | ssh docker load`) — contorna o FortiGate, que bloqueia
#      `docker pull` no servidor.
#   3. Copia docker-compose.yml + app-config.deploy.yaml + .env (gerado dos
#      secrets) para o servidor e sobe o stack lá (`docker compose up -d`).
#   4. Health check remoto.
#
# Pré-requisitos no runner: docker + uma chave SSH (~/.ssh/id_ed25519) autorizada
# no usuário de deploy do servidor, e o servidor no known_hosts.
# Pré-requisitos no servidor: docker (usuário no grupo docker) e a imagem base
# `postgres:15` já carregada (também bloqueada pelo FortiGate → side-load 1x).

on:
  workflow_call:
    inputs:
      environment:
        description: Nome do environment do GitHub (development/quality/production)
        required: true
        type: string
      runner:
        description: Label do runner self-hosted (development/quality/production)
        required: true
        type: string
      ssh-host:
        description: Host/IP do servidor de deploy (destino do SSH)
        required: true
        type: string
      ssh-user:
        description: Usuário SSH no servidor de deploy
        required: true
        type: string
      deploy-dir:
        description: Diretório de deploy no servidor (ex. ~/backstage)
        required: true
        type: string
      image-tag:
        description: Tag da imagem Docker a construir (ex. backstage:latest)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    environment: ${{ inputs.environment }}

    env:
      SSH_TARGET: ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build da imagem AQUI (multi-stage self-contained: não precisa Node no host).
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build backstage-app -f deploy/Dockerfile -t "${{ inputs.image-tag }}"

      # Envia a imagem pronta pro servidor (contorna o FortiGate no pull).
      - name: Ship image to server
        run: |
          docker save "${{ inputs.image-tag }}" | gzip \
            | ssh $SSH_OPTS "$SSH_TARGET" 'gunzip | docker load'

      # MinIO (storage do TechDocs): o servidor não consegue `docker pull`
      # (FortiGate), então o runner puxa e envia — só se ainda não existirem lá.
      - name: Ship MinIO images to server (if missing)
        run: |
          for img in minio/minio:latest minio/mc:latest; do
            if ssh $SSH_OPTS "$SSH_TARGET" "docker image inspect $img >/dev/null 2>&1"; then
              echo "✔ $img já existe no servidor"
            else
              docker pull "$img"
              docker save "$img" | gzip | ssh $SSH_OPTS "$SSH_TARGET" 'gunzip | docker load'
            fi
          done

      - name: Write .env
        # Secrets do environment expostos como env (sem o prefixo reservado GITHUB_)
        # e gravados no .env com os nomes que a aplicação/compose esperam.
        env:
          APP_BASE_URL:      ${{ secrets.APP_BASE_URL }}
          GHUB_TOKEN:        ${{ secrets.GHUB_TOKEN }}
          GHUB_OWNER:        ${{ secrets.GHUB_OWNER }}
          GHUB_REPO:         ${{ secrets.GHUB_REPO }}
          GHUB_BRANCH:       ${{ secrets.GHUB_BRANCH }}
          POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_USER:        ${{ secrets.MINIO_ROOT_USER }}
          MINIO_PASSWORD:    ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          cat > .env << ENVEOF
          IMAGE_TAG=${{ inputs.image-tag }}
          APP_BASE_URL=${APP_BASE_URL}
          GITHUB_TOKEN=${GHUB_TOKEN}
          GITHUB_OWNER=${GHUB_OWNER}
          GITHUB_REPO=${GHUB_REPO}
          GITHUB_BRANCH=${GHUB_BRANCH}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
          MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
          ENVEOF
          chmod 600 .env

      - name: Copy stack files to server
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" "mkdir -p '${{ inputs.deploy-dir }}'"
          scp $SSH_OPTS \
            deploy/docker-compose.yml \
            deploy/app-config.deploy.yaml \
            .env \
            "$SSH_TARGET:${{ inputs.deploy-dir }}/"

      - name: Deploy stack (remoto)
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" \
            "cd '${{ inputs.deploy-dir }}' && docker compose up -d --remove-orphans"

      - name: Health check (remoto)
        run: |
          ssh $SSH_OPTS "$SSH_TARGET" bash -s << 'REMOTE'
          cd "${{ inputs.deploy-dir }}"
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:7007/healthcheck >/dev/null 2>&1 \
               || curl -fsS http://localhost:7007 >/dev/null 2>&1; then
              echo "✅ Backstage UP"
              docker compose ps
              exit 0
            fi
            echo "aguardando backstage subir... ($i/40)"
            sleep 5
          done
          echo "❌ Health check falhou — últimos logs:"
          docker compose logs --tail=150 backstage
          exit 1
          REMOTE
